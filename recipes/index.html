<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marina Harman">
    <meta name="description" content="recipe book">
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="A book with recipes">
    <meta property="og:url" content="https://marinaharman.github.io/wdd131/recipes/index.html">
    <meta property="og:image" content="https://marinaharman.github.io/wdd131/images/recipe1/apple-crisp.jpg">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="recipes.css">
    <script src="recipes.js" defer></script>
</head>
<body>
    <div class="heading">
        <img src="https://wddbyui.github.io/wdd131/images/recipe1/recipe-book.png" alt="recipebook logo" id="logo">
        <h1>RecipeBook</h1>
    </div>
    <div id="search-bar">
        <input id="search" type="text" placeholder="Find a recipe">
        <img src="https://wddbyui.github.io/wdd131/images/recipe1/search.svg" alt="search">
    </div>
    <hr>
    <div class="recipe">
        <img src="https://wddbyui.github.io/wdd131/images/recipe1/apple-crisp.jpg" alt="apple crisp">
        <div class="big-screen">
            <button>dessert</button>
            <h2>Apple Crisp</h2>
            
            <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
            >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>

            <p>This apple crisp recipe is a simple yet delicious fall dessert that's great served
                warm with vanilla ice cream.
            </p>
        </div>
                
    </div>              
                

    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>    
    </footer>
</body>
</html>
