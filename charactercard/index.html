<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marina Harman">
    <meta name="description" content="character card">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A card for a character.">
    <meta property="og:url" content="https://marinaharman.github.io/wdd131/charactercard/index.html">
    <meta property="og:image" content="https://marinaharman.github.io/wdd131/charactercard/snortleblat.webp">
    <title>Character Card</title>
    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <div class="card">
        <img src="snortleblat.webp" alt="snortleblat" class="image">
        <h1 class="name">Snortleblat</h1>
        <p class="stats"><strong>Class: </strong>Swamp Beast Diplomat</p>
        <p class="stats" id="level"><strong>Level: </strong>5</p>
        <p class="stats" id="health"><strong>Health: </strong>100</p>
        <button class="buttons" id="attack">Attacked</button>
        <button class="buttons" id="level-up">Level Up</button>
    </div>
</body>
</html>
